<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Live</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080711;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:90px;
}

header{
  padding:28px 20px 10px;
  font-size:38px;
  font-weight:bold;
}

header span{color:#c20cff}

.tabs{
  display:flex;
  gap:55px;
  padding:22px 34px;
  font-size:24px;
  border-bottom:1px solid #292733;
}

.tab.active{
  color:#ff1bbd;
  border-bottom:5px solid #ff1bbd;
  padding-bottom:20px;
}

.rooms{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding:34px;
}

.room{
  background:#171a2b;
  border-radius:38px;
  padding:28px 18px 38px;
  text-align:center;
}

.icon{
  width:190px;
  height:190px;
  margin:auto;
  border-radius:50%;
  background:linear-gradient(135deg,#ef1a9e,#8e20ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:90px;
}

.room h2{
  font-size:30px;
  margin:30px 0 20px;
}

.live{
  color:#ff45a9;
  font-size:20px;
  margin-bottom:28px;
}

.join{
  border:0;
  color:white;
  background:linear-gradient(90deg,#a51cff,#d20ee5);
  border-radius:35px;
  padding:17px 45px;
  font-size:20px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:90px;
  background:#111523;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:10;
}

.nav{
  text-align:center;
  font-size:15px;
}

.nav-icon{
  font-size:30px;
  display:block;
}

.plus{
  width:75px;
  height:75px;
  border-radius:50%;
  background:linear-gradient(135deg,#a900ff,#d815df);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
}

.livebox{
  display:none;
  padding:25px;
  text-align:center;
}

video{
  width:100%;
  max-width:500px;
  border-radius:25px;
  background:#111;
}

.controls{
  margin-top:20px;
}

.controls button{
  margin:5px;
  padding:14px 22px;
  border:0;
  border-radius:25px;
  background:#b817e8;
  color:white;
  font-size:17px;
}
</style>
</head>

<body>

<header>🎧 Audio <span>Live</span></header>

<div class="tabs">
  <div class="tab active">Popular</div>
  <div class="tab">Following</div>
  <div class="tab">New</div>
</div>

<div class="rooms">

  <div class="room">
    <div class="icon">🎮</div>
    <h2>Game<br>Room</h2>
    <div class="live">● LIVE · 96</div>
    <button class="join" onclick="joinRoom('Game Room')">Join</button>
  </div>

  <div class="room">
    <div class="icon">🎤</div>
    <h2>Music<br>Room</h2>
    <div class="live">● LIVE · 128</div>
    <button class="join" onclick="joinRoom('Music Room')">Join</button>
  </div>

  <div class="room">
    <div class="icon">❤️</div>
    <h2>Love<br>Room</h2>
    <div class="live">● LIVE · 74</div>
    <button class="join" onclick="joinRoom('Love Room')">Join</button>
  </div>

  <div class="room">
    <div class="icon">💬</div>
    <h2>Chat<br>Room</h2>
    <div class="live">● LIVE · 112</div>
    <button class="join" onclick="joinRoom('Chat Room')">Join</button>
  </div>

</div>

<div class="livebox" id="liveBox">
  <h2 id="roomTitle">Live Room</h2>

  <video id="video" autoplay playsinline></video>

  <div class="controls">
    <button onclick="toggleMic()" id="micBtn">🎤 Mic</button>
    <button onclick="toggleCamera()" id="camBtn">📷 Camera</button>
    <button onclick="leaveRoom()">❌ Leave</button>
  </div>
</div>

<div class="bottom">

  <div class="nav">
    <span class="nav-icon">👤</span>
    Profile
  </div>

  <div class="nav">
    <span class="nav-icon">💬</span>
    Chat
  </div>

  <div class="plus">+</div>

  <div class="nav">
    <span class="nav-icon">📺</span>
    Live
  </div>

  <div class="nav">
    <span class="nav-icon">🏠</span>
    Home
  </div>

</div>

<script>
let stream=null;
let micOn=true;
let cameraOn=true;

async function joinRoom(name){

  document.querySelector(".rooms").style.display="none";
  document.querySelector(".tabs").style.display="none";

  const box=document.getElementById("liveBox");
  box.style.display="block";
  document.getElementById("roomTitle").innerText=name;

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:true
    });

    document.getElementById("video").srcObject=stream;

  }catch(error){
    alert("Camera/Microphone permission دیں۔");
  }
}

function toggleMic(){

  if(!stream)return;

  stream.getAudioTracks().forEach(track=>{
    track.enabled=!track.enabled;
    micOn=track.enabled;
  });

  document.getElementById("micBtn").innerText=
    micOn ? "🎤 Mic ON" : "🔇 Mic OFF";
}

function toggleCamera(){

  if(!stream)return;

  stream.getVideoTracks().forEach(track=>{
    track.enabled=!track.enabled;
    cameraOn=track.enabled;
  });

  document.getElementById("camBtn").innerText=
    cameraOn ? "📷 Camera ON" : "🚫 Camera OFF";
}

function leaveRoom(){

  if(stream){
    stream.getTracks().forEach(track=>track.stop());
    stream=null;
  }

  document.getElementById("video").srcObject=null;
  document.getElementById("liveBox").style.display="none";
  document.querySelector(".rooms").style.display="grid";
  document.querySelector(".tabs").style.display="flex";
}
</script>

</body>
</html>
