<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Live</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090712;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  padding:22px 18px 14px;
  font-size:30px;
  font-weight:bold;
}

.logo span{color:#b52cff}

.tabs{
  display:flex;
  gap:28px;
  padding:12px 18px 18px;
  border-bottom:1px solid #292033;
}

.tab{
  font-size:18px;
  color:#ddd;
}

.active{
  color:#ff22b8;
  border-bottom:3px solid #ff22b8;
  padding-bottom:10px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding:18px;
}

.room{
  background:#171b2b;
  border-radius:25px;
  padding:20px 12px;
  text-align:center;
  min-height:280px;
}

.room-icon{
  width:120px;
  height:120px;
  margin:auto;
  border-radius:50%;
  background:linear-gradient(135deg,#ff35a8,#7b2cff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
}

.room h2{
  margin:18px 0 10px;
}

.live-count{
  color:#ff4f9a;
  margin-bottom:15px;
}

button{
  border:0;
  background:linear-gradient(135deg,#8d32ff,#e000d8);
  color:white;
  border-radius:30px;
  padding:13px 25px;
  font-size:17px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:90px;
  background:#101524;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav{
  text-align:center;
  font-size:14px;
}

.nav span{
  display:block;
  font-size:30px;
}

.plus{
  width:65px;
  height:65px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#8d32ff,#e000d8);
  font-size:35px;
}

/* LIVE SCREEN */

#liveScreen{
  display:none;
  position:fixed;
  inset:0;
  background:#05050a;
  z-index:99;
}

#camera{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#111;
}

.liveTop{
  position:absolute;
  top:20px;
  left:20px;
  right:20px;
  display:flex;
  justify-content:space-between;
  z-index:2;
}

.liveBadge{
  background:#ff1493;
  padding:10px 18px;
  border-radius:20px;
  font-weight:bold;
}

.closeBtn{
  background:rgba(0,0,0,.6);
  width:45px;
  height:45px;
  padding:0;
}

.liveControls{
  position:absolute;
  bottom:35px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:15px;
}

.control{
  width:55px;
  height:55px;
  padding:0;
  background:rgba(0,0,0,.65);
  font-size:24px;
}
</style>
</head>

<body>

<header>
  🎧 <span class="logo">Audio <span>Live</span></span>
</header>

<div class="tabs">
  <div class="tab active">Popular</div>
  <div class="tab">Following</div>
  <div class="tab">New</div>
</div>

<div class="grid">

  <div class="room">
    <div class="room-icon">🎮</div>
    <h2>Game Room</h2>
    <div class="live-count">LIVE · 96 ●</div>
    <button onclick="startLive()">Join</button>
  </div>

  <div class="room">
    <div class="room-icon">🎤</div>
    <h2>Music Room</h2>
    <div class="live-count">LIVE · 128 ●</div>
    <button onclick="startLive()">Join</button>
  </div>

  <div class="room">
    <div class="room-icon">❤️</div>
    <h2>Friends</h2>
    <div class="live-count">LIVE · 52 ●</div>
    <button onclick="startLive()">Join</button>
  </div>

  <div class="room">
    <div class="room-icon">💬</div>
    <h2>Chat Room</h2>
    <div class="live-count">LIVE · 74 ●</div>
    <button onclick="startLive()">Join</button>
  </div>

</div>

<div class="bottom">

  <div class="nav">
    <span>👤</span>
    Profile
  </div>

  <div class="nav">
    <span>💬</span>
    Chat
  </div>

  <div class="plus" onclick="startLive()">+</div>

  <div class="nav">
    <span>📺</span>
    Live
  </div>

  <div class="nav">
    <span>🏠</span>
    Home
  </div>

</div>


<!-- LIVE CAMERA SCREEN -->

<div id="liveScreen">

  <video id="camera" autoplay playsinline muted></video>

  <div class="liveTop">
    <div class="liveBadge">🔴 LIVE</div>
    <button class="closeBtn" onclick="stopLive()">✕</button>
  </div>

  <div class="liveControls">
    <button class="control" onclick="toggleMic()" id="micBtn">🎤</button>
    <button class="control" onclick="toggleCamera()" id="camBtn">📷</button>
  </div>

</div>


<script>

let stream = null;
let micOn = true;
let cameraOn = true;

async function startLive(){

  try{

    stream = await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:true
    });

    document.getElementById("camera").srcObject = stream;
    document.getElementById("liveScreen").style.display = "block";

  }catch(error){

    alert(
      "Camera اور Microphone کی اجازت ضروری ہے۔\n\n" +
      "براہِ کرم Allow دبائیں۔"
    );

    console.log(error);
  }
}


function stopLive(){

  if(stream){

    stream.getTracks().forEach(track => {
      track.stop();
    });

    stream = null;
  }

  document.getElementById("camera").srcObject = null;
  document.getElementById("liveScreen").style.display = "none";
}


function toggleMic(){

  if(!stream) return;

  const audioTracks = stream.getAudioTracks();

  audioTracks.forEach(track => {
    track.enabled = !track.enabled;
    micOn = track.enabled;
  });

  document.getElementById("micBtn").textContent =
    micOn ? "🎤" : "🔇";
}


function toggleCamera(){

  if(!stream) return;

  const videoTracks = stream.getVideoTracks();

  videoTracks.forEach(track => {
    track.enabled = !track.enabled;
    cameraOn = track.enabled;
  });

  document.getElementById("camBtn").textContent =
    cameraOn ? "📷" : "🚫";
}

</script>

</body>
</html>
